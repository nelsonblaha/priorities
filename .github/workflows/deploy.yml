name: Test, Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test

      - name: Create test network
        run: |
          docker network rm priorities-test-net 2>/dev/null || true
          docker network create priorities-test-net

      - name: Start test CouchDB
        run: |
          docker rm -f couchdb-test 2>/dev/null || true
          docker run -d --name couchdb-test \
            --network priorities-test-net \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=testpass \
            couchdb:latest

      - name: Wait for CouchDB
        run: |
          for i in {1..30}; do
            if docker exec couchdb-test curl -s http://localhost:5984/ > /dev/null 2>&1; then
              echo "CouchDB is ready"
              break
            fi
            echo "Waiting for CouchDB... ($i)"
            sleep 2
          done

      - name: Create test database
        run: |
          docker exec couchdb-test curl -X PUT http://admin:testpass@localhost:5984/priorities

      - name: Build test Docker image
        run: docker build -t priorities-test:latest .

      - name: Create test config
        run: |
          mkdir -p /tmp/priorities-test-config
          cat > /tmp/priorities-test-config/Configuration.toml << 'EOF'
          [server]
          host = "0.0.0.0"
          allowed_origin = "http://localhost:8082"

          [database]
          host = "couchdb-test"
          port = 5984
          db_name = "priorities"
          username = "admin"
          password = "testpass"
          EOF

      - name: Start test app container
        run: |
          docker rm -f priorities-test 2>/dev/null || true
          docker run -d --name priorities-test \
            --network priorities-test-net \
            -p 8082:8080 \
            -v /tmp/priorities-test-config/Configuration.toml:/root/Configuration.toml:ro \
            priorities-test:latest

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/ > /dev/null; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cypress dependencies
        working-directory: tests
        run: npm ci

      - name: Run Cypress tests
        working-directory: tests
        run: npx cypress run --config baseUrl=http://localhost:8082

      - name: Cleanup test environment
        if: always()
        run: |
          docker rm -f priorities-test 2>/dev/null || true
          docker rm -f couchdb-test 2>/dev/null || true
          docker network rm priorities-test-net 2>/dev/null || true
          rm -rf /tmp/priorities-test-config

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t priorities:latest .

      - name: Deploy container
        run: |
          docker stop priorities || true
          docker rm priorities || true
          docker run -d \
            --name priorities \
            -p 8081:8080 \
            --restart unless-stopped \
            -v /home/ben/priorities-config/Configuration.toml:/root/Configuration.toml:ro \
            priorities:latest
