name: Test, Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test

      - name: Start test CouchDB
        run: |
          docker rm -f couchdb-test 2>/dev/null || true
          docker run -d --name couchdb-test \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=testpass \
            -p 5985:5984 \
            couchdb:latest

      - name: Wait for CouchDB
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5985/ > /dev/null; then
              echo "CouchDB is ready"
              break
            fi
            echo "Waiting for CouchDB... ($i)"
            sleep 2
          done

      - name: Create test database
        run: |
          curl -X PUT http://admin:testpass@localhost:5985/priorities

      - name: Create test config
        run: |
          cat > Configuration.toml << 'EOF'
          [server]
          host = "0.0.0.0"
          allowed_origin = "http://localhost:8080"

          [database]
          host = "localhost"
          port = 5985
          db_name = "priorities"
          username = "admin"
          password = "testpass"
          EOF

      - name: Build and start app
        run: |
          cargo build --release
          ./target/release/priorities &
          echo $! > /tmp/priorities-test.pid

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/ > /dev/null; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cypress dependencies
        working-directory: tests
        run: npm ci

      - name: Run Cypress tests
        working-directory: tests
        run: npx cypress run

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/priorities-test.pid 2>/dev/null) 2>/dev/null || true
          docker rm -f couchdb-test 2>/dev/null || true
          rm -f Configuration.toml /tmp/priorities-test.pid

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t priorities:latest .

      - name: Deploy container
        run: |
          docker stop priorities || true
          docker rm priorities || true
          docker run -d \
            --name priorities \
            -p 8081:8080 \
            --restart unless-stopped \
            -v /home/ben/priorities-config/Configuration.toml:/root/Configuration.toml:ro \
            priorities:latest
