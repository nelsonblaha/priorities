name: Test, Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t priorities:latest .

      - name: Deploy container
        run: |
          docker stop priorities || true
          docker rm priorities || true
          docker run -d \
            --name priorities \
            --network host \
            --restart unless-stopped \
            -v /home/ben/priorities-config/Configuration.toml:/root/Configuration.toml:ro \
            priorities:latest
