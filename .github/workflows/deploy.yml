name: Test, Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [nelnet-ci-updated]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSSL development libraries
        run: |
          apt-get update
          apt-get install -y libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test

      - name: Create test network
        run: |
          docker network rm priorities-test-net 2>/dev/null || true
          docker network create priorities-test-net 2>/dev/null || true

      - name: Start test CouchDB
        run: |
          docker rm -f couchdb-test 2>/dev/null || true
          docker run -d --name couchdb-test \
            --network priorities-test-net \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=testpass \
            couchdb:latest

      - name: Wait for CouchDB
        run: |
          for i in {1..30}; do
            if docker exec couchdb-test curl -s http://localhost:5984/ > /dev/null 2>&1; then
              echo "CouchDB is ready"
              break
            fi
            echo "Waiting for CouchDB... ($i)"
            sleep 2
          done

      - name: Create test database
        run: |
          docker exec couchdb-test curl -X PUT http://admin:testpass@localhost:5984/priorities

      - name: Build test Docker image
        run: docker build -t priorities-test:latest .

      - name: Start test app container
        run: |
          docker rm -f priorities-test 2>/dev/null || true
          # Start container on both test network (for CouchDB) and blaha-ci-shared (for runner access)
          docker run -d --name priorities-test \
            --network priorities-test-net \
            priorities-test:latest
          # Connect to blaha-ci-shared so runner can access it directly
          docker network connect blaha-ci-shared priorities-test
          # Inject test config via docker cp (avoids DinD path issues)
          # Config: allowed_origin=http://priorities-test:8080 for container-to-container access
          echo "W3NlcnZlcl0KaG9zdCA9ICIwLjAuMC4wIgphbGxvd2VkX29yaWdpbiA9ICJodHRwOi8vcHJpb3JpdGllcy10ZXN0OjgwODAiCgpbZGF0YWJhc2VdCmhvc3QgPSAiY291Y2hkYi10ZXN0Igpwb3J0ID0gNTk4NApkYl9uYW1lID0gInByaW9yaXRpZXMiCnVzZXJuYW1lID0gImFkbWluIgpwYXNzd29yZCA9ICJ0ZXN0cGFzcyIK" | base64 -d > /tmp/test-config.toml
          docker cp /tmp/test-config.toml priorities-test:/root/Configuration.toml
          # Restart to pick up new config
          docker restart priorities-test

      - name: Wait for app
        run: |
          # Access via container name on shared network (blaha-ci-shared)
          for i in {1..30}; do
            if curl -s http://priorities-test:8080/ > /dev/null; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cypress dependencies
        working-directory: tests
        run: npm ci

      - name: Run Cypress tests
        working-directory: tests
        run: npx cypress run --config baseUrl=http://priorities-test:8080

      - name: Cleanup test environment
        if: always()
        run: |
          docker rm -f priorities-test 2>/dev/null || true
          docker rm -f couchdb-test 2>/dev/null || true
          docker network rm priorities-test-net 2>/dev/null || true
          rm -f /tmp/test-config.toml

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t priorities:latest .

      - name: Deploy container
        run: |
          docker stop priorities || true
          docker rm priorities || true
          docker run -d \
            --name priorities \
            --network priorities-net \
            -p 8081:8080 \
            --restart unless-stopped \
            -v /home/ben/priorities-config/Configuration.toml:/root/Configuration.toml:ro \
            priorities:latest
